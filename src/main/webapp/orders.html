<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Aishwarya Mart</title>


<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --burgundy: #8f0000;
        --dark-burgundy: #650000;
        --light-burgundy: #aa2424;
        --cream: #faf6ee;
        --warm-white: #fffdf9;
        --soft-cream: #f3ece1;
        --text: #321d1d;
        --muted: #806c6c;
        --border: #eadbd4;
        --green: #58704d;
    }

    body {
        font-family: Arial, sans-serif;
        background: var(--cream);
        color: var(--text);
        min-height: 100vh;
    }

    a {
        text-decoration: none;
        color: inherit;
    }

    /* HEADER */
    header {
        height: 76px;
        background: var(--warm-white);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 6%;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 21px;
        font-weight: bold;
        color: var(--burgundy);
    }

    .brand img {
        width: 43px;
        height: 43px;
        border-radius: 50%;
        object-fit: cover;
    }

    nav {
        display: flex;
        align-items: center;
        gap: 28px;
        color: var(--text);
        font-size: 14px;
    }

    nav a {
        transition: 0.2s;
    }

    nav a:hover {
        color: var(--burgundy);
    }

    .bag-link {
        color: var(--burgundy);
        font-weight: bold;
    }

    /* PAGE */
    main {
        width: min(1100px, 90%);
        margin: 55px auto 80px;
    }

    .page-heading {
        margin-bottom: 35px;
    }

    .eyebrow {
        color: var(--burgundy);
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 2px;
        margin-bottom: 10px;
    }

    h1 {
        font-family: Georgia, serif;
        font-size: 45px;
        font-weight: normal;
        margin-bottom: 10px;
    }

    .intro {
        color: var(--muted);
        font-size: 15px;
    }

    /* ORDER CARD */
    .orders-container {
        display: flex;
        flex-direction: column;
        gap: 22px;
    }

    .order-card {
        background: var(--warm-white);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
    }

    .order-top {
        padding: 20px 24px;
        background: var(--soft-cream);
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
    }

    .order-info {
        display: flex;
        gap: 35px;
        flex-wrap: wrap;
    }

    .info-item span {
        display: block;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 5px;
    }

    .info-item strong {
        font-size: 14px;
    }

    .status {
        padding: 8px 13px;
        border-radius: 20px;
        background: #e6efdf;
        color: var(--green);
        font-size: 12px;
        font-weight: bold;
    }

    .order-body {
        padding: 24px;
    }

    .product-row {
        display: flex;
        align-items: center;
        gap: 17px;
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
    }

    .product-row:last-child {
        border-bottom: none;
    }

    .product-image {
        width: 72px;
        height: 72px;
        border-radius: 12px;
        object-fit: cover;
        background: var(--soft-cream);
    }

    .product-details {
        flex: 1;
    }

    .product-details h3 {
        font-size: 15px;
        margin-bottom: 6px;
    }

    .product-details p {
        color: var(--muted);
        font-size: 13px;
    }

    .product-price {
        font-weight: bold;
        color: var(--burgundy);
        font-size: 15px;
    }

    .order-bottom {
        margin-top: 20px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .total-label {
        color: var(--muted);
        font-size: 13px;
    }

    .total {
        font-size: 20px;
        color: var(--burgundy);
        font-weight: bold;
    }

    .view-button {
        display: inline-block;
        padding: 11px 18px;
        border: 1px solid var(--burgundy);
        color: var(--burgundy);
        border-radius: 8px;
        font-size: 13px;
        font-weight: bold;
        transition: 0.2s;
    }

    .view-button:hover {
        background: var(--burgundy);
        color: white;
    }

    /* EMPTY */
    .empty-state {
        display: none;
        background: var(--warm-white);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 70px 25px;
        text-align: center;
    }

    .empty-icon {
        width: 65px;
        height: 65px;
        border-radius: 50%;
        background: var(--soft-cream);
        color: var(--burgundy);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 27px;
    }

    .empty-state h2 {
        font-family: Georgia, serif;
        font-size: 28px;
        font-weight: normal;
        margin-bottom: 10px;
    }

    .empty-state p {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 25px;
    }

    .shop-button {
        display: inline-block;
        background: var(--burgundy);
        color: white;
        padding: 13px 24px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: bold;
    }

    .shop-button:hover {
        background: var(--dark-burgundy);
    }

    /* FOOTER */
    footer {
        background: var(--dark-burgundy);
        color: #fff4ef;
        padding: 35px 6%;
        text-align: center;
        font-size: 13px;
    }

    footer p {
        opacity: 0.8;
    }

    /* MOBILE */
    @media (max-width: 700px) {
        header {
            padding: 0 5%;
        }

        nav {
            gap: 14px;
            font-size: 12px;
        }

        nav a:nth-child(2),
        nav a:nth-child(3) {
            display: none;
        }

        main {
            width: 92%;
            margin-top: 35px;
        }

        h1 {
            font-size: 36px;
        }

        .order-top {
            align-items: flex-start;
            flex-direction: column;
        }

        .order-info {
            gap: 18px;
        }

        .order-body {
            padding: 18px;
        }

        .product-row {
            align-items: flex-start;
        }

        .product-image {
            width: 60px;
            height: 60px;
        }

        .product-price {
            font-size: 13px;
        }

        .order-bottom {
            align-items: flex-start;
            flex-direction: column;
            gap: 15px;
        }
    }
</style>


</head>

<body>

<header>
    <a href="index.html" class="brand">
        <img src="https://i.postimg.cc/KYvtyfcX/Whats-App-Image-2026-09-15-at-2-03-03-PM.jpg"
             alt="Aishwarya Mart">
        <span>Aishwarya Mart</span>
    </a>


<nav>
    <a href="index.html">Shop</a>
    <a href="wishlist.html">Wishlist</a>
    <a href="account.html">Account</a>
    <a href="cart.html" class="bag-link">Bag</a>
</nav>


</header>

<main>


<section class="page-heading">
    <div class="eyebrow">YOUR ACCOUNT</div>
    <h1>My orders.</h1>
    <p class="intro">Keep track of your recent purchases and order details.</p>
</section>

<section class="orders-container" id="ordersContainer">
    <div class="empty-state" style="display:block;text-align:center;padding:45px 20px;">
        <p>Loading your orders...</p>
    </div>
</section>

<!-- EMPTY STATE -->
<section class="empty-state" id="emptyState">
    <div class="empty-icon">&#9825;</div>
    <h2>No orders yet</h2>
    <p>Once you place an order, your purchases will appear here.</p>
    <a href="index.html" class="shop-button">Start shopping</a>
</section>


</main>

<footer>
    <p>&#169; 2026 Aishwarya Mart &#183; Style that feels like you.</p>
</footer>


<script>
    const ordersContainer = document.getElementById("ordersContainer");
    const emptyState = document.getElementById("emptyState");
    const selectedRatings = {};

    async function loadOrders() {
        ordersContainer.style.display = "flex";
        emptyState.style.display = "none";
        ordersContainer.innerHTML = '<div class="empty-state" style="display:block;text-align:center;padding:45px 20px;"><p>Loading your orders...</p></div>';

        try {
            const response = await fetch("orders", {
                headers: { "Accept": "application/json" },
                credentials: "same-origin"
            });

            if (response.status === 401) {
                window.location.href = "login.html";
                return;
            }
            if (!response.ok) throw new Error("Could not load your orders.");

            const orders = await response.json();
            if (!Array.isArray(orders) || orders.length === 0) {
                ordersContainer.style.display = "none";
                emptyState.style.display = "block";
                return;
            }

            const cards = await Promise.all(orders.map(async order => {
                const itemsResponse = await fetch(
                    "orders?action=items&orderId=" + encodeURIComponent(order.id),
                    { headers: { "Accept": "application/json" }, credentials: "same-origin" }
                );
                if (!itemsResponse.ok) throw new Error("Could not load items for order #" + order.id);
                const items = await itemsResponse.json();
                return createOrderCard(order, Array.isArray(items) ? items : []);
            }));
            ordersContainer.innerHTML = cards.join("");
        } catch (error) {
            console.error(error);
            ordersContainer.innerHTML = `
                <div class="empty-state" style="display:block;text-align:center;padding:45px 20px;">
                    <h2>Couldn't load your orders</h2>
                    <p>Please check your connection and try again.</p>
                    <button class="shop-button" onclick="loadOrders()" style="border:0;cursor:pointer;">Try again</button>
                </div>`;
        }
    }

    function createOrderCard(order, items) {
        const status = String(order.status || "PENDING").toUpperCase();
        const itemHTML = items.length ? items.map((item, index) => {
            const reviewId = "review_" + order.id + "_" + item.productId + "_" + index;
            const image = item.imageUrl
                ? '<img class="product-image" src="' + escapeHtml(item.imageUrl) + '" alt="' + escapeHtml(item.productName || "Product") + '" onerror="this.style.display=\'none\'">'
                : "";
            const review = status === "DELIVERED" ? `
                <div class="review-box" id="${reviewId}">
                    <div class="review-title">How was this product?</div>
                    <div class="stars" aria-label="Choose a rating from one to five">
                        ${[1,2,3,4,5].map(n => '<button type="button" class="star" aria-label="' + n + ' stars" onclick="selectRating(\'' + reviewId + '\',' + n + ')">&#9733;</button>').join("")}
                    </div>
                    <textarea class="review-comment" id="${reviewId}_comment" maxlength="1000" placeholder="Write a short review..."></textarea>
                    <button type="button" class="review-submit" onclick="submitReview(${Number(item.productId)}, '${reviewId}')">Submit review</button>
                </div>` : "";
            return `
                <div class="product-row">
                    ${image}
                    <div class="product-details">
                        <h3>${escapeHtml(item.productName || ("Product #" + item.productId))}</h3>
                        <p>Quantity: ${Number(item.quantity) || 0}</p>
                    </div>
                    <div class="product-price">&#8377;${formatMoney((Number(item.price) || 0) * (Number(item.quantity) || 0))}</div>
                </div>
                ${review}`;
        }).join("") : '<p class="intro">No item details are available for this order.</p>';

        return `
            <article class="order-card">
                <div class="order-top">
                    <div class="order-info">
                        <div class="info-item"><span>Order</span><strong>#${escapeHtml(order.id)}</strong></div>
                        <div class="info-item"><span>Date</span><strong>${escapeHtml(formatDate(order.createdAt))}</strong></div>
                        <div class="info-item"><span>Items</span><strong>${items.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0)}</strong></div>
                    </div>
                    <div class="status">${escapeHtml(status)}</div>
                </div>
                <div class="order-body">
                    ${itemHTML}
                    <div class="order-bottom">
                        <div><div class="total-label">Order total</div><div class="total">&#8377;${formatMoney(order.totalAmount)}</div></div>
                    </div>
                </div>
            </article>`;
    }

    function selectRating(reviewId, rating) {
        selectedRatings[reviewId] = rating;
        const box = document.getElementById(reviewId);
        if (!box) return;
        box.querySelectorAll(".star").forEach((star, index) => star.classList.toggle("active", index < rating));
    }

    async function submitReview(productId, reviewId) {
        const rating = selectedRatings[reviewId];
        if (!rating) { alert("Please select a star rating first."); return; }
        const box = document.getElementById(reviewId);
        if (!box) return;
        const button = box.querySelector(".review-submit");
        const comment = document.getElementById(reviewId + "_comment").value.trim();
        button.disabled = true;
        button.textContent = "Submitting...";
        try {
            const body = new URLSearchParams({ productId: String(productId), rating: String(rating), comment });
            const response = await fetch("reviews", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8", "Accept": "application/json" },
                credentials: "same-origin",
                body: body.toString()
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || "Could not submit review.");
            box.innerHTML = '<div class="review-done">Thank you! Your review has been submitted.</div>';
        } catch (error) {
            alert(error.message || "Could not submit review.");
            button.disabled = false;
            button.textContent = "Submit review";
        }
    }

    function formatDate(value) {
        if (!value) return "Date unavailable";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return date.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
    }

    function formatMoney(value) {
        return Number(value || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function escapeHtml(value) {
        return String(value == null ? "" : value)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    loadOrders();
</script>

</body>
</html>
