<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Wishlist | Aishwarya Mart</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --burgundy: #8f0000;
        --dark-burgundy: #650000;
        --light-burgundy: #aa2424;
        --cream: #faf6ee;
        --warm-white: #fffdf9;
        --soft-cream: #f3ece1;
        --text: #321d1d;
        --muted: #806c6c;
        --border: #eadbd4;
    }

    body {
        font-family: Arial, sans-serif;
        background: var(--cream);
        color: var(--text);
        min-height: 100vh;
    }

    a {
        text-decoration: none;
        color: inherit;
    }

    /* HEADER */

    header {
        height: 76px;
        background: var(--warm-white);
        border-bottom: 1px solid var(--border);

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 6%;

        position: sticky;
        top: 0;
        z-index: 100;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;

        color: var(--burgundy);
        font-size: 21px;
        font-weight: bold;
    }

    .brand img {
        width: 43px;
        height: 43px;

        object-fit: cover;
        border-radius: 50%;
    }

    nav {
        display: flex;
        align-items: center;
        gap: 28px;

        font-size: 14px;
    }

    nav a:hover {
        color: var(--burgundy);
    }

    .wishlist-link {
        color: var(--burgundy);
        font-weight: bold;
    }

    /* MAIN */

    main {
        width: min(1100px, 90%);
        margin: 55px auto 80px;
    }

    .heading {
        margin-bottom: 35px;
    }

    .eyebrow {
        color: var(--burgundy);

        font-size: 12px;
        font-weight: bold;

        letter-spacing: 2px;

        margin-bottom: 10px;
    }

    h1 {
        font-family: Georgia, serif;

        font-size: 45px;
        font-weight: normal;

        margin-bottom: 10px;
    }

    .intro {
        color: var(--muted);
        font-size: 15px;
    }

    /* WISHLIST GRID */

    .wishlist-grid {
        display: grid;

        grid-template-columns:
            repeat(3, 1fr);

        gap: 22px;
    }

    .product-card {
        background: var(--warm-white);

        border: 1px solid var(--border);
        border-radius: 17px;

        overflow: hidden;

        position: relative;

        transition: 0.2s;
    }

    .product-card:hover {
        transform: translateY(-3px);
        border-color: #d7bdb5;
    }

    .product-image {
        width: 100%;
        height: 260px;

        object-fit: cover;

        background: var(--soft-cream);
    }

    .remove-button {
        position: absolute;

        top: 13px;
        right: 13px;

        width: 36px;
        height: 36px;

        border: none;
        border-radius: 50%;

        background: rgba(255, 253, 249, 0.95);

        color: var(--burgundy);

        font-size: 19px;

        cursor: pointer;

        box-shadow: 0 3px 12px rgba(50, 29, 29, 0.12);
    }

    .remove-button:hover {
        background: var(--burgundy);
        color: white;
    }

    .product-info {
        padding: 20px;
    }

    .category {
        color: var(--burgundy);

        font-size: 10px;
        font-weight: bold;

        letter-spacing: 1.5px;
        text-transform: uppercase;

        margin-bottom: 8px;
    }

    .product-info h2 {
        font-family: Georgia, serif;

        font-size: 21px;
        font-weight: normal;

        margin-bottom: 7px;
    }

    .description {
        color: var(--muted);

        font-size: 12px;
        line-height: 1.5;

        margin-bottom: 15px;
    }

    .product-bottom {
        display: flex;

        align-items: center;
        justify-content: space-between;

        gap: 10px;
    }

    .price {
        color: var(--burgundy);

        font-size: 16px;
        font-weight: bold;
    }

    .bag-button {
        border: none;

        background: var(--burgundy);
        color: white;

        padding: 10px 14px;

        border-radius: 7px;

        cursor: pointer;

        font-size: 11px;
        font-weight: bold;
    }

    .bag-button:hover {
        background: var(--dark-burgundy);
    }

    /* EMPTY STATE */

    .empty-state {
        display: none;

        background: var(--warm-white);

        border: 1px solid var(--border);
        border-radius: 18px;

        padding: 75px 25px;

        text-align: center;
    }

    .empty-icon {
        width: 68px;
        height: 68px;

        margin: 0 auto 20px;

        border-radius: 50%;

        background: var(--soft-cream);
        color: var(--burgundy);

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 30px;
    }

    .empty-state h2 {
        font-family: Georgia, serif;

        font-size: 29px;
        font-weight: normal;

        margin-bottom: 10px;
    }

    .empty-state p {
        color: var(--muted);

        font-size: 14px;

        margin-bottom: 25px;
    }

    .shop-button {
        display: inline-block;

        background: var(--burgundy);
        color: white;

        padding: 13px 24px;

        border-radius: 8px;

        font-size: 13px;
        font-weight: bold;
    }

    .shop-button:hover {
        background: var(--dark-burgundy);
    }

    /* FOOTER */

    footer {
        background: var(--dark-burgundy);

        color: #fff4ef;

        padding: 35px 6%;

        text-align: center;

        font-size: 13px;
    }

    footer p {
        opacity: 0.8;
    }

    /* MOBILE */

    @media (max-width: 850px) {

        .wishlist-grid {
            grid-template-columns: repeat(2, 1fr);
        }

    }

    @media (max-width: 600px) {

        header {
            padding: 0 5%;
        }

        nav {
            gap: 14px;
            font-size: 12px;
        }

        nav a:nth-child(2),
        nav a:nth-child(3) {
            display: none;
        }

        main {
            width: 92%;
            margin-top: 35px;
        }

        h1 {
            font-size: 36px;
        }

        .wishlist-grid {
            grid-template-columns: 1fr;
        }

        .product-image {
            height: 300px;
        }

    }

</style>


</head>

<body>

<header>


<a href="index.html" class="brand">

    <img
        src="https://i.postimg.cc/KYvtyfcX/Whats-App-Image-2026-09-15-at-2-03-03-PM.jpg"
        alt="Aishwarya Mart"
    >

    <span>Aishwarya Mart</span>

</a>


<nav>

    <a href="index.html">
        Shop
    </a>

    <a href="orders.html">
        Orders
    </a>

    <a href="account.html">
        Account
    </a>

    <a href="cart.html">
        Bag
    </a>

</nav>


</header>

<main>


<section class="heading">

    <div class="eyebrow">
        SAVED FOR LATER
    </div>

    <h1>
        My wishlist.
    </h1>

    <p class="intro">
        The pieces you've been keeping an eye on.
    </p>

</section>


<!-- WISHLIST: loaded from the signed-in user's database records -->
<section class="wishlist-grid" id="wishlistGrid" aria-live="polite">
</section>


<!-- EMPTY -->

<section
    class="empty-state"
    id="emptyState"
>

    <div class="empty-icon">
        ♡
    </div>

    <h2>
        Your wishlist is empty
    </h2>

    <p>
        Save something you love and it'll appear here.
    </p>

    <a
        href="index.html"
        class="shop-button"
    >
        Explore the shop
    </a>

</section>


</main>

<footer>


<p>
    © 2026 Aishwarya Mart · Style that feels like you.
</p>


</footer>

<script>
    const wishlistGrid = document.getElementById("wishlistGrid");
    const emptyState = document.getElementById("emptyState");

    async function loadWishlist() {
        wishlistGrid.style.display = "grid";
        wishlistGrid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:50px;color:#806c6c;">Loading your wishlist...</p>';

        try {
            const response = await fetch("wishlist", {
                headers: { "Accept": "application/json" },
                credentials: "same-origin"
            });

            if (response.status === 401) {
                window.location.href = "login.html";
                return;
            }
            if (!response.ok) throw new Error("Wishlist request failed.");

            const products = await response.json();
            if (!Array.isArray(products)) throw new Error("Invalid wishlist response.");
            renderWishlist(products);
        } catch (error) {
            console.error("Could not load wishlist:", error);
            emptyState.style.display = "none";
            wishlistGrid.style.display = "grid";
            wishlistGrid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:50px;color:#8f0000;">Your wishlist could not be loaded. Please refresh and try again.</p>';
        }
    }

    function renderWishlist(products) {
        if (!products.length) {
            wishlistGrid.style.display = "none";
            emptyState.style.display = "block";
            return;
        }

        emptyState.style.display = "none";
        wishlistGrid.style.display = "grid";
        wishlistGrid.innerHTML = products.map(product => {
            const image = product.imageUrl || "";
            const price = Number(product.price || 0).toLocaleString("en-IN");
            return `
                <article class="product-card">
                    <button class="remove-button" type="button"
                        onclick="removeFromWishlist(${Number(product.id)})"
                        aria-label="Remove ${escapeHtml(product.name)} from wishlist">×</button>
                    <img class="product-image" src="${escapeHtml(image)}"
                        alt="${escapeHtml(product.name)}" loading="lazy">
                    <div class="product-info">
                        <div class="category">${escapeHtml(product.category || "General")}</div>
                        <h2>${escapeHtml(product.name || "Product")}</h2>
                        <p class="description">${escapeHtml(product.description || "")}</p>
                        <div class="product-bottom">
                            <span class="price">₹${price}</span>
                            <button class="bag-button" type="button"
                                onclick="addToBag(${Number(product.id)}, this)">ADD TO BAG</button>
                        </div>
                    </div>
                </article>
            `;
        }).join("");
    }

    async function removeFromWishlist(productId) {
        try {
            const body = new URLSearchParams({ action: "remove", productId: String(productId) });
            const response = await fetch("wishlist", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
                credentials: "same-origin",
                body: body.toString()
            });
            if (response.status === 401) {
                window.location.href = "login.html";
                return;
            }
            if (!response.ok) throw new Error("Could not remove this item.");
            const result = await response.json();
            if (!result.success) throw new Error("The item was not removed.");
            await loadWishlist();
        } catch (error) {
            console.error(error);
            alert(error.message || "Could not remove this item. Please try again.");
        }
    }

    async function addToBag(productId, button) {
        button.disabled = true;
        try {
            const body = new URLSearchParams({ action: "add", productId: String(productId), quantity: "1" });
            const response = await fetch("cart", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
                credentials: "same-origin",
                body: body.toString()
            });
            if (response.status === 401) {
                window.location.href = "login.html";
                return;
            }
            if (!response.ok) throw new Error("Could not add this item to your bag.");
            button.textContent = "ADDED";
            window.setTimeout(() => {
                button.textContent = "ADD TO BAG";
                button.disabled = false;
            }, 1000);
        } catch (error) {
            console.error(error);
            alert(error.message || "Could not add this item to your bag.");
            button.disabled = false;
        }
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    loadWishlist();
</script>

</body>
</html>
